name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm install -g npm@latest

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm exec vitest run tests/cli.test.ts tests/readme.test.ts --testNamePattern "auto search|Google search|known challenge providers|README"

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          test "$expected" = "$GITHUB_REF_NAME"

      - run: npm publish
